[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openftir"
version = "1.0.0"
description = "Context-aware FTIR spectrum analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.18"]
dev = ["jupyter>=1.0", "ipython>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
